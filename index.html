<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社辦時段預約系統</title>
  <style>
    :root { --primary: #4A90E2; --bg: #f4f7f6; --text: #333; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
    
    /* Marquee */
    .marquee-container { background: #ffeb3b; padding: 5px; overflow: hidden; white-space: nowrap; font-weight: bold; }
    .marquee-content { display: inline-block; animation: marquee 15s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

    /* Layout */
    .container { max-width: 800px; margin: 20px auto; padding: 10px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    /* Timetable Grid */
    .timetable { display: grid; grid-template-columns: 80px repeat(5, 1fr); gap: 5px; text-align: center; font-size: 12px; }
    .cell { padding: 10px 5px; border-radius: 5px; background: #e0e0e0; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; min-height: 40px;}
    .header-cell { background: #333; color: white; font-weight: bold; }
    .time-cell { background: #ddd; font-weight: bold; cursor: default; }
    
    /* Status Colors */
    .available { background: #e8f5e9; border: 1px solid #4caf50; }
    .available:hover { background: #c8e6c9; }
    .booked { background: #ffe0b2; color: #e65100; cursor: default; }
    .booked.mine { background: #bbdefb; color: #0d47a1; cursor: pointer; border: 1px dashed #0d47a1;}
    .fixed { background: #f48fb1; color: white; cursor: default; }
    .expired { background: #bdbdbd; color: #757575; cursor: not-allowed; }

    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;}
    .modal { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
    .modal.active { display: block; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;}
    button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold;}
    button.danger { background: #f44336; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Marquee -->
  <div class="marquee-container" id="marqueeDiv" class="hidden">
    <div class="marquee-content" id="marqueeText">載入公告中...</div>
  </div>

  <div class="container">
    <div class="card" id="userInfoCard" style="display:none;">
      <h3>👋 歡迎, <span id="userName"></span></h3>
      <p>目前社辦密碼：<strong style="color:red; font-size:1.2em;" id="roomPwd"></strong></p>
      <button id="adminBtn" class="hidden" style="background:#333;" onclick="openAdmin()">⚙️ 管理員後台</button>
    </div>

    <div class="card" id="scheduleCard" style="display:none;">
      <h4>每週最多預約 3 個時段 (點擊綠色格子預約，點擊藍色格子取消)</h4>
      <div class="timetable" id="timetable">
        <!-- 網格由 JS 生成 -->
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal active">
      <h3>註冊社員資料</h3>
      <input type="text" id="regName" placeholder="真實姓名 (必填)">
      <input type="text" id="regNick" placeholder="暱稱 (必填，顯示於預約表)">
      <button onclick="register()">送出註冊</button>
    </div>
  </div>

  <!-- Popup Announcement Modal -->
  <div class="modal-overlay" id="popupModal">
    <div class="modal active">
      <h3>📣 最新公告</h3>
      <p id="popupText"></p>
      <button onclick="closePopup()">我知道了</button>
    </div>
  </div>

    <!-- Admin Modal (管理員後台) -->
  <div class="modal-overlay" id="adminModal" style="display: none; z-index: 2000;">
    <div class="modal active">
      <h3>⚙️ 管理員後台</h3>
      <input type="text" id="announcementText" placeholder="輸入跑馬燈與彈出公告">
      <button onclick="updateAnnouncement()">發布公告</button>
      
      <hr style="margin:15px 0; border:0.5px solid #eee;">
      
      <!-- 📌 新增固定行程 -->
      <h4>📌 新增固定行程</h4>
      <label style="font-size: 12px; color: #666;">選擇星期：</label>
      <select id="fixedDay" style="width: 100%; padding: 8px; margin-bottom: 8px;">
        <option value="1">星期一</option>
        <option value="2">星期二</option>
        <option value="3">星期三</option>
        <option value="4">星期四</option>
        <option value="5">星期五</option>
      </select>

      <label style="font-size: 12px; color: #666;">選擇時段：</label>
      <select id="fixedTime" style="width: 100%; padding: 8px; margin-bottom: 8px;">
        <option value="08:00-09:00">08:00-09:00</option>
        <option value="09:00-10:00">09:00-10:00</option>
        <option value="10:00-11:00">10:00-11:00</option>
        <option value="11:00-12:00">11:00-12:00</option>
        <option value="12:00-13:30">12:00-13:30</option>
        <option value="13:30-14:30">13:30-14:30</option>
        <option value="14:30-15:30">14:30-15:30</option>
        <option value="15:30-16:30">15:30-16:30</option>
        <option value="16:30-17:30">16:30-17:30</option>
        <option value="18:00-19:00">18:00-19:00</option>
        <option value="19:00-20:00">19:00-20:00</option>
        <option value="20:00-21:00">20:00-21:00</option>
        <option value="21:00-22:00">21:00-22:00</option>
      </select>

      <input type="text" id="fixedLabel" placeholder="顯示名稱 (例: 樂器班)" style="width: 100%; padding: 8px; margin-bottom: 8px;">
      <button onclick="addFixedBooking()">設定固定時段</button>

      <hr style="margin:15px 0; border:0.5px solid #eee;">

      <!-- ✨ 新增：撤銷固定行程區塊 -->
      <h4>🗑️ 撤銷固定行程</h4>
      <select id="deleteFixedDay" style="width: 100%; padding: 8px; margin-bottom: 8px;">
        <option value="1">星期一</option>
        <option value="2">星期二</option>
        <option value="3">星期三</option>
        <option value="4">星期四</option>
        <option value="5">星期五</option>
      </select>

      <select id="deleteFixedTime" style="width: 100%; padding: 8px; margin-bottom: 8px;">
        <option value="08:00-09:00">08:00-09:00</option>
        <option value="09:00-10:00">09:00-10:00</option>
        <option value="10:00-11:00">10:00-11:00</option>
        <option value="11:00-12:00">11:00-12:00</option>
        <option value="12:00-13:30">12:00-13:30</option>
        <option value="13:30-14:30">13:30-14:30</option>
        <option value="14:30-15:30">14:30-15:30</option>
        <option value="15:30-16:30">15:30-16:30</option>
        <option value="16:30-17:30">16:30-17:30</option>
        <option value="18:00-19:00">18:00-19:00</option>
        <option value="19:00-20:00">19:00-20:00</option>
        <option value="20:00-21:00">20:00-21:00</option>
        <option value="21:00-22:00">21:00-22:00</option>
      </select>
      <button class="danger" onclick="deleteFixedBooking()">確認撤銷固定行程</button>

      <hr style="margin:15px 0; border:0.5px solid #eee;">
      
      <input type="text" id="newPassword" placeholder="輸入新密碼 (例: 5678)">
      <button onclick="updatePassword()">更新社辦密碼</button>
      <br><br>

      <button onclick="document.getElementById('adminModal').style.display='none'">關閉後台</button>
    </div>
  </div>


  <!-- Loading Modal -->
  <div class="modal-overlay" id="loadingModal" style="display:flex;">
    <h2 style="color:white;">系統載入中...</h2>
  </div>

  <!-- LIFF SDK & App Logic -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  ⁠<script src="app.js?v=2"></script>⁠
</body>
</html>
